[project]
name = "aiodiscover"
version = "3.3.0"
license = "Apache-2.0"
description = "Discover hosts by arp and ptr lookup"
authors = [{ name = "J. Nick Koston", email = "nick@koston.org" }]
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["classifiers", "dependencies", "optional-dependencies"]

[project.urls]
"Repository" = "https://github.com/bluetooth-devices/aiodiscover"
"Documentation" = "https://aiodiscover.readthedocs.io"
"Bug Tracker" = "https://github.com/bluetooth-devices/aiodiscover/issues"
"Changelog" = "https://github.com/bluetooth-devices/aiodiscover/blob/main/CHANGELOG.md"

[tool.poetry]
classifiers = [
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Development Status :: 5 - Production/Stable",
]
packages = [
    { include = "aiodiscover" },
]

[project.scripts]
aiodiscover = "aiodiscover.cli:main"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
async_timeout = { version = ">=4.0.1", python = "<3.11" }
aiodns = ">=4.0.4"
ifaddr = ">0.0.0"
pyroute2 = ">=0.9.6"
cached_ipaddress = ">=1.1.2"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10"
pytest-cov = ">=7.1.0,<8"
pytest-asyncio = ">=1.4.0,<1.5.0"
pytest-sugar = "^1.1.1"
pytest-timeout = "^2.3.1"
mypy = "^2.1.0"
blockbuster = ">=1.5.5,<2.0.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
myst-parser = { version = ">=5.1.0", python = ">=3.11"}
sphinx = { version = ">=9.0.4", python = ">=3.11"}
furo = { version = ">=2025.12.19", python = ">=3.11"}
sphinx-autobuild = { version = ">=2025.8.25", python = ">=3.11"}


[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = [
    "aiodiscover/__init__.py:__version__",
]
build_command = "pip install poetry && poetry build"

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    "chore*",
    "ci*",
]

[tool.semantic_release.changelog.environment]
keep_trailing_newline = true

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.branches.noop]
match = "(?!main$)"
prerelease = true

[tool.pytest.ini_options]
addopts = "-v -Wdefault --cov=aiodiscover --cov-report=term-missing:skip-covered"
pythonpath = ["src"]
log_cli="true"
log_level="NOTSET"
timeout = 90

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "@overload",
    "if TYPE_CHECKING",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
ignore = [
    "S101", # use of assert
    "D203", # 1 blank line required before class docstring
    "D212", # Multi-line docstring summary should start at the first line
    "D213", # Multi-line docstring summary should start at the second line
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public module
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D107", # Missing docstring in `__init__`
    "D400", # First line should end with a period
    "D401", # First line of docstring should be in imperative mood
    "D205", # 1 blank line required between summary line and description
    "D415", # First line should end with a period, question mark, or exclamation point
    "D417", # Missing argument descriptions in the docstring
    "E501", # Line too long
    "E721", # Do not compare types, for exact checks use `is` and `is not`
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
    "B008", # Do not perform function call
    "S110", # `try`-`except`-`pass` detected, consider logging the exception
    "D106", # Missing docstring in public nested class
    "ANN401", # Dynamically typed expressions (Any) are disallowed
    "ASYNC109", # Async function definition with a `timeout` parameter
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments in function definition
    "PLR0915", # Too many statements
    "PLR2004", # Magic value used in comparison
    "PLW2901", # `for` loop variable overwritten by assignment target
    "TRY003", # Avoid specifying long messages outside the exception class
    "TID252", # Prefer absolute imports over relative imports
]
select = [
    "A",     # flake8-builtins
    "ANN",   # flake8-annotations
    "ARG",   # flake8-unused-arguments
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "C4",    # flake8-comprehensions
    "C90",   # mccabe
    "D",     # flake8-docstrings
    "DTZ",   # flake8-datetimez
    "E",     # pycodestyle
    "EM",    # flake8-errmsg
    "ERA",   # flake8-eradicate
    "EXE",   # flake8-executable
    "F",     # pyflakes
    "FA",    # flake8-future-annotations
    "FIX",   # flake8-fixme
    "FLY",   # flynt
    "FURB",  # refurb
    "G",     # flake8-logging-format
    "I",     # isort
    "ICN",   # flake8-import-conventions
    "INP",   # flake8-no-pep420
    "ISC",   # flake8-implicit-str-concat
    "LOG",   # flake8-logging
    "N",     # pep8-naming
    "NPY",   # NumPy-specific rules
    "PERF",  # perflint
    "PGH",   # pygrep-hooks
    "PIE",   # flake8-pie
    "PL",    # pylint
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-use-pathlib
    "PYI",   # flake8-pyi
    "Q",     # flake8-quotes
    "RET",   # flake8-return
    "RSE",   # flake8-raise
    "RUF",   # ruff specific
    "S",     # flake8-bandit
    "SIM",   # flake8-simplify
    "SLF",   # flake8-self
    "SLOT",  # flake8-slots
    "T10",   # flake8-debugger
    "T20",   # flake8-print
    "TC",    # flake8-type-checking
    "TD",    # flake8-todos
    "TID",   # flake8-tidy-imports
    "TRY",   # tryceratops
    "UP",    # pyupgrade
    "W",     # pycodestyle
    "YTT",   # flake8-2020
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "ANN",
    "ARG",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "PGH003",
    "PLC0415",
    "S101",
    "S106",
    "SIM117",
    "SLF",
    "TC003",
]
"aiodiscover/cli.py" = ["T203"]
"profile_discovery.py" = ["T203"]
"setup.py" = ["D100"]
"conftest.py" = ["D100"]
"docs/conf.py" = ["D100", "INP001"]

[tool.ruff.lint.isort]
known-first-party = ["aiodiscover", "tests"]

[tool.mypy]
disable_error_code = "import-untyped,unused-ignore"
check_untyped_defs = true
ignore_missing_imports = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
mypy_path = "src/"
no_implicit_optional = true
show_error_codes = true
warn_unreachable = true
warn_unused_ignores = true
exclude = [
    'docs/.*',
    'setup.py',
]

[[tool.mypy.overrides]]
module = "tests.*"
allow_untyped_defs = true

[[tool.mypy.overrides]]
module = "docs.*"
ignore_errors = true

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"


